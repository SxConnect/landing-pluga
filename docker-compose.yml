version: '3.8'

services:
  landing-pluga:
    image: ghcr.io/sxconnect/landing-pluga:latest
    container_name: landing-pluga
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      - VIRTUAL_HOST=pluga.xpanel.com.br
      - LETSENCRYPT_HOST=pluga.xpanel.com.br
      - LETSENCRYPT_EMAIL=silvanoxavierpro@gmail.com
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=xpanel-net"
      - "traefik.http.routers.pluga.rule=Host(`pluga.xpanel.com.br`)"
      - "traefik.http.routers.pluga.entrypoints=web,websecure"
      - "traefik.http.services.pluga.loadbalancer.server.port=80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=xpanel-net"
        - "traefik.http.routers.pluga.rule=Host(`pluga.xpanel.com.br`)"
        - "traefik.http.routers.pluga.entrypoints=web,websecure"
        - "traefik.http.services.pluga.loadbalancer.server.port=80"
    networks:
      - xpanel-net

networks:
  xpanel-net:
    external: true
