<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <filter id="plugGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Tomada / Plug estilizado com pinos e cabo em loop moderno -->
  <path d="M14 12L20 6" stroke="url(#plugGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#plugGlow)"/>
  <path d="M22 20L28 14" stroke="url(#plugGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#plugGlow)"/>
  <rect x="15" y="15" width="20" height="14" rx="6" transform="rotate(-45 25 22)" stroke="url(#plugGrad)" stroke-width="3" fill="#08182b" filter="url(#plugGlow)"/>
  <path d="M31 28C34 31 38 33 39 37C40 41 38 43 35 44C31 45 27 41 24 37" stroke="url(#plugGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
