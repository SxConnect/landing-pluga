<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Cartão de crédito -->
  <rect x="8" y="15" width="48" height="34" rx="6" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="2"/>
  <!-- Faixa magnética -->
  <line x1="8" y1="24" x2="56" y2="24" stroke="#082f49" stroke-width="4"/>
  <!-- Chip do cartão -->
  <rect x="14" y="32" width="9" height="7" rx="1.5" fill="#facc15"/>
  <!-- Linhas decorativas do cartão -->
  <line x1="27" y1="36" x2="40" y2="36" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Selo verde de pagamento aprovado / cadeado -->
  <circle cx="48" cy="42" r="10" fill="#00e676"/>
  <path d="M44 42L47 45L52 39" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
